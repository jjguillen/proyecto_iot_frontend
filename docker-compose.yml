version: '3.8'

services:
  iot-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-dashboard
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Descomenta esto si quieres ejecutar el backend Spring también en Docker
  # backend:
